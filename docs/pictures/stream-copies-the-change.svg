<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="t d">
  <title id="t">The BatchItems stream copies every item change</title>
  <desc id="d">A BatchItems row with status QUEUED, a DynamoDB stream labeled NEW_IMAGE, and a dashed stream record with the same QUEUED status.</desc>
  <rect width="1200" height="640" fill="#f3ead8"/>
  <g transform="translate(70 140)">
    <rect width="300" height="340" rx="14" fill="#fff8ee" stroke="#1b1612" stroke-width="6"/>
    <text x="24" y="48" font-size="28" font-family="ui-sans-serif, sans-serif" fill="#6f6458">BatchItems</text>
    <text x="24" y="92" font-size="36" font-family="Georgia, serif" fill="#1b1612">Ana</text>
    <rect x="40" y="150" width="220" height="72" rx="10" fill="#e2b84a" transform="rotate(-6 150 186)"/>
    <text x="150" y="196" text-anchor="middle" font-size="26" font-weight="700" font-family="ui-sans-serif, sans-serif" fill="#1b1612">QUEUED</text>
  </g>
  <g transform="translate(440 120)">
    <rect width="300" height="360" rx="16" fill="#3d4f66" stroke="#1b1612" stroke-width="8"/>
    <rect x="30" y="40" width="240" height="120" fill="#1b1612"/>
    <rect x="70" y="80" width="160" height="18" fill="#8aa0b8"/>
    <text x="150" y="240" text-anchor="middle" fill="#f3ead8" font-size="36" font-family="Georgia, serif">stream</text>
    <text x="150" y="282" text-anchor="middle" fill="#c9d4e0" font-size="22" font-family="ui-sans-serif, sans-serif">NEW_IMAGE, 24 h</text>
  </g>
  <g transform="translate(830 180)">
    <rect width="300" height="240" rx="14" fill="#eef2f7" stroke="#1b1612" stroke-width="5" stroke-dasharray="12 10"/>
    <text x="24" y="44" font-size="22" font-family="ui-sans-serif, sans-serif" fill="#6f6458">stream record</text>
    <rect x="40" y="90" width="220" height="72" rx="10" fill="#e2b84a"/>
    <text x="150" y="136" text-anchor="middle" font-size="26" font-weight="700" font-family="ui-sans-serif, sans-serif" fill="#1b1612">QUEUED</text>
  </g>
  <polygon points="385,270 385,330 430,300" fill="#1b1612"/>
  <polygon points="755,270 755,330 800,300" fill="#1b1612"/>
  <text x="600" y="560" text-anchor="middle" font-size="34" font-family="Georgia, serif" fill="#1b1612">Every item change is copied. Decisions and keys are not.</text>
</svg>
