info:
  name: Retry every failed item
  type: http
  seq: 3
http:
  method: POST
  url: '{{baseUrl}}/batches/{{batchId}}/retry-failed'
  auth: inherit
runtime:
  assertions:
  - expression: res.status
    operator: eq
    value: '202'
examples:
  - name: "202"
    description: Captured from a Floci run. IDs change each run.
    request:
      method: POST
      url: "{{baseUrl}}/batches/9b8156d7-972d-418d-ac1d-0fda6e2918f7/retry-failed"
    response:
      status: 202
      statusText: "Accepted"
      body:
        type: json
        data: |-
          {
            "requeued": 0
          }
docs: 'Returns {requeued: n}: the FAILED items under 5 attempts.'
