info:
  name: 'Cancel a decided item: 409'
  type: http
  seq: 2
http:
  method: POST
  url: '{{baseUrl}}/batches/{{batchId}}/items/{{itemId}}/cancel'
  auth: inherit
runtime:
  assertions:
  - expression: res.status
    operator: eq
    value: '409'
examples:
  - name: "409"
    description: Captured from a Floci run. IDs change each run.
    request:
      method: POST
      url: "{{baseUrl}}/batches/9b8156d7-972d-418d-ac1d-0fda6e2918f7/items/01a0cf75-997b-73f8-9893-ada9e6ad902a/cancel"
    response:
      status: 409
      statusText: "Conflict"
      body:
        type: json
        data: |-
          {
            "error": "invalid_transition"
          }
docs: 'On a FAILED item this returns 200 {item_id, status: CANCELLED}, and again 200 on a second call.'
