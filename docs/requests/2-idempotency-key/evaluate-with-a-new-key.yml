info:
  name: Evaluate with a new key
  type: http
  seq: 1
http:
  method: POST
  url: '{{baseUrl}}/evaluations'
  auth: inherit
  headers:
  - name: Idempotency-Key
    value: '{{idempotencyKey}}'
  body:
    type: json
    data: |-
      {
        "name": "Eva",
        "cpf": "222.333.444-05",
        "credit_score": 820,
        "current_invoice_cents": 100000,
        "credit_limit_cents": 1000000,
        "late_payments": 0,
        "monthly_spend_cents": [
          100000,
          110000,
          90000
        ]
      }
runtime:
  assertions:
  - expression: res.status
    operator: eq
    value: '200'
  scripts:
  - type: before-request
    code: |-
      const { v4: uuidv4 } = require("uuid");
      bru.setVar("idempotencyKey", uuidv4());
  - type: after-response
    code: bru.setVar("keyedDecisionId", res.body.decision_id);
