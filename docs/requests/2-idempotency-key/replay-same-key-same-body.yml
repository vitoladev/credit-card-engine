info:
  name: 'Replay: same key, same body'
  type: http
  seq: 2
http:
  method: POST
  url: '{{baseUrl}}/evaluations'
  auth: inherit
  headers:
  - name: Idempotency-Key
    value: '{{idempotencyKey}}'
  body:
    type: json
    data: |-
      {
        "name": "Eva",
        "cpf": "222.333.444-05",
        "credit_score": 820,
        "current_invoice_cents": 100000,
        "credit_limit_cents": 1000000,
        "late_payments": 0,
        "monthly_spend_cents": [
          100000,
          110000,
          90000
        ]
      }
runtime:
  assertions:
  - expression: res.status
    operator: eq
    value: '200'
  scripts:
  - type: tests
    code: |-
      test("Replay: same key, same body", function () {
        expect(res.body.decision_id).to.equal(bru.getVar("keyedDecisionId"));
        expect(res.getHeader("idempotent-replayed")).to.equal("true");
      });
examples:
  - name: "200"
    description: Captured from a Floci run. IDs change each run.
    request:
      method: POST
      url: "{{baseUrl}}/evaluations"
      headers:
      - name: "Idempotency-Key"
        value: "eb9060ab-c793-48a4-9fe2-ea39fa3c8c4e"
      - name: "content-type"
        value: "application/json"
      body:
        type: json
        data: |-
          {
            "name": "Eva",
            "cpf": "222.333.444-05",
            "credit_score": 820,
            "current_invoice_cents": 100000,
            "credit_limit_cents": 1000000,
            "late_payments": 0,
            "monthly_spend_cents": [
              100000,
              110000,
              90000
            ]
          }
    response:
      status: 200
      statusText: "OK"
      headers:
      - name: "idempotent-replayed"
        value: "true"
      body:
        type: json
        data: |-
          {
            "decision_id": "fbd83d9e-c5aa-460f-b9b5-15fbf9106eeb",
            "name": "Eva",
            "cpf_masked": "222.***.***-05",
            "decision": "APPROVED",
            "revolving_amount_cents": 800000,
            "reasons": [
              "eligible"
            ]
          }
docs: 'Returns the first response again, with the header idempotent-replayed: true. Nothing is evaluated
  or stored twice.'
