info:
  name: 'Same key, another body: 422'
  type: http
  seq: 3
http:
  method: POST
  url: '{{baseUrl}}/evaluations'
  auth: inherit
  headers:
  - name: Idempotency-Key
    value: '{{idempotencyKey}}'
  body:
    type: json
    data: |-
      {
        "name": "Ana",
        "cpf": "390.533.447-05",
        "credit_score": 780,
        "current_invoice_cents": 50000,
        "credit_limit_cents": 500000,
        "late_payments": 0,
        "monthly_spend_cents": [
          80000,
          90000,
          70000
        ]
      }
runtime:
  assertions:
  - expression: res.status
    operator: eq
    value: '422'
  scripts:
  - type: tests
    code: |-
      test("Same key, another body: 422", function () {
        expect(res.body.error).to.equal("idempotency_key_reused");
      });
