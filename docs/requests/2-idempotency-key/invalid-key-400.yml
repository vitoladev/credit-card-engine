info:
  name: 'Invalid key: 400'
  type: http
  seq: 4
http:
  method: POST
  url: '{{baseUrl}}/evaluations'
  auth: inherit
  headers:
  - name: Idempotency-Key
    value: has space
  body:
    type: json
    data: |-
      {
        "name": "Ana",
        "cpf": "390.533.447-05",
        "credit_score": 780,
        "current_invoice_cents": 50000,
        "credit_limit_cents": 500000,
        "late_payments": 0,
        "monthly_spend_cents": [
          80000,
          90000,
          70000
        ]
      }
runtime:
  assertions:
  - expression: res.status
    operator: eq
    value: '400'
  scripts:
  - type: tests
    code: |-
      test("Invalid key: 400", function () {
        expect(res.body.error).to.equal("invalid_idempotency_key");
      });
