  url: '{{baseUrl}}/evaluations'
  auth: inherit
  body:
    type: json
    data: |-
      {
        "name": "Carla",
        "cpf": "987.654.321-00",
        "credit_score": 690,
        "current_invoice_cents": 900000,
        "credit_limit_cents": 500000,
        "late_payments": 1,
        "monthly_spend_cents": [
          100000,
          120000,
          110000
        ]
      }
runtime:
  assertions:
  - expression: res.status
    operator: eq
    value: '200'
  scripts:
  - type: tests
    code: |-
      test("Denied: invoice over the credit limit (Carla)", function () {
        expect(res.body.reasons[0]).to.equal("invoice_exceeds_credit_limit");
      });
examples:
