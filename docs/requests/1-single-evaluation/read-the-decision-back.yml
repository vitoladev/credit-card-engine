info:
  name: Read the decision back
  type: http
  seq: 2
http:
  method: GET
  url: '{{baseUrl}}/evaluations/{{decisionId}}'
  auth: inherit
runtime:
  assertions:
  - expression: res.status
    operator: eq
    value: '200'
  scripts:
  - type: tests
    code: |-
      test("Read the decision back", function () {
        expect(res.body.decision_id).to.equal(bru.getVar("decisionId"));
      });
docs: 'Returns the same body as the POST. Run "Approved: Ana" first: it saves decisionId.'
