info:
  name: 'Denied: no credit limit (Joana)'
  type: http
  seq: 8
http:
  method: POST
  url: '{{baseUrl}}/evaluations'
  auth: inherit
  body:
    type: json
    data: |-
      {
        "name": "Joana",
        "cpf": "666.777.888-30",
        "credit_score": 750,
        "current_invoice_cents": 0,
        "credit_limit_cents": 0,
        "late_payments": 0,
        "monthly_spend_cents": [
          10000
        ]
      }
runtime:
  assertions:
  - expression: res.status
    operator: eq
    value: '200'
  scripts:
  - type: tests
    code: |-
      test("Denied: no credit limit (Joana)", function () {
        expect(res.body.reasons[0]).to.equal("no_credit_limit");
      });
