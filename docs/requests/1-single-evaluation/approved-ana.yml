info:
  name: "Approved: Ana"
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/evaluations"
  body:
    type: json
    data: |-
      {
        "name": "Ana",
        "cpf": "390.533.447-05",
        "credit_score": 780,
        "current_invoice_cents": 50000,
        "credit_limit_cents": 500000,
        "late_payments": 0,
        "monthly_spend_cents": [
          80000,
          90000,
          70000
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("decisionId", res.body.decision_id);
    - type: tests
      code: |-
        test("Approved: Ana", function () {
          expect(res.body.decision).to.equal("APPROVED");
          expect(res.body.cpf_masked).to.equal("390.***.***-05");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: "200"
    description: Captured from a Floci run. IDs change each run.
    request:
      url: "{{baseUrl}}/evaluations"
      method: POST
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "name": "Ana",
            "cpf": "390.533.447-05",
            "credit_score": 780,
            "current_invoice_cents": 50000,
            "credit_limit_cents": 500000,
            "late_payments": 0,
            "monthly_spend_cents": [
              80000,
              90000,
              70000
            ]
          }
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "decision_id": "d313417d-6f3e-4dbb-9568-1f3dd3e2fb74",
            "name": "Ana",
            "cpf_masked": "390.***.***-05",
            "decision": "APPROVED",
            "revolving_amount_cents": 250000,
            "reasons": [
              "eligible"
            ]
          }

docs: "Score 780, invoice under the limit, spend under 90%: approved with 50% of the limit, capped at limit minus invoice (R$ 2.500,00)."
