info:
  name: 'Invalid customer: 422'
  type: http
  seq: 1
http:
  method: POST
  url: '{{baseUrl}}/evaluations'
  auth: inherit
  body:
    type: json
    data: |-
      {
        "name": "Ana",
        "cpf": "390.533.447-06",
        "credit_score": -1,
        "current_invoice_cents": 50000,
        "credit_limit_cents": 500000,
        "late_payments": 0,
        "monthly_spend_cents": [
          80000,
          90000,
          70000
        ]
      }
runtime:
  assertions:
  - expression: res.status
    operator: eq
    value: '422'
  scripts:
  - type: tests
    code: |-
      test("Invalid customer: 422", function () {
        expect(res.body.error).to.equal("invalid_customer");
      });
docs: 'Every violation comes back at once: wrong CPF check digits and a negative score.'
