info:
  name: Only the approved items
  type: http
  seq: 7
http:
  method: GET
  url: '{{baseUrl}}/batches/{{batchId}}/items?status=APPROVED'
  auth: inherit
  params:
  - name: status
    value: APPROVED
    type: query
runtime:
  assertions:
  - expression: res.status
    operator: eq
    value: '200'
