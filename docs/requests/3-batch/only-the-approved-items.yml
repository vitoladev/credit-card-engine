info:
  name: Only the approved items
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/batches/{{batchId}}/items?status=APPROVED"
  params:
    - name: status
      value: APPROVED
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: "200"
    description: Captured from a Floci run. IDs change each run.
    request:
      url: "{{baseUrl}}/batches/9b8156d7-972d-418d-ac1d-0fda6e2918f7/items?status=APPROVED"
      method: GET
      params:
        - name: status
          value: APPROVED
          type: query
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "batch_id": "9b8156d7-972d-418d-ac1d-0fda6e2918f7",
            "items": [
              {
                "item_id": "01a0cf75-997b-73f8-9893-ada9e6ad902a",
                "name": "Ana",
                "cpf_masked": "390.***.***-05",
                "status": "APPROVED",
                "reasons": [
                  "eligible"
                ],
                "revolving_amount_cents": 250000,
                "attempts": 1
              }
            ]
          }
