runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("batchId", res.body.batch_id);
        bru.setVar("itemId", res.body.item_ids[0]);
    - type: tests
      code: |-
        test("Submit a batch of 100", function () {
          expect(res.body.queued).to.equal(100);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "202"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

