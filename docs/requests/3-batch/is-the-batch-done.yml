info:
  name: Is the batch done?
  type: http
  seq: 8
http:
  method: GET
  url: '{{baseUrl}}/batches/{{batchId}}/items?limit=1&status=QUEUED'
  auth: inherit
  params:
  - name: limit
    value: '1'
    type: query
  - name: status
    value: QUEUED
    type: query
runtime:
  assertions:
  - expression: res.status
    operator: eq
    value: '200'
docs: A batch has no status. This call is how a caller sees that no item is still QUEUED.
