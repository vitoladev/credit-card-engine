info:
  name: Only the denied items
  type: http
  seq: 6
http:
  method: GET
  url: '{{baseUrl}}/batches/{{batchId}}/items?status=DENIED'
  auth: inherit
  params:
  - name: status
    value: DENIED
    type: query
runtime:
  assertions:
  - expression: res.status
    operator: eq
    value: '200'
docs: 'Reads the by-status index: only the items in that status (ADR 0007).'
