info:
  name: Only the denied items
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/batches/{{batchId}}/items?status=DENIED"
  params:
    - name: status
      value: DENIED
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: "200"
    description: Captured from a Floci run. IDs change each run.
    request:
      url: "{{baseUrl}}/batches/9b8156d7-972d-418d-ac1d-0fda6e2918f7/items?status=DENIED"
      method: GET
      params:
        - name: status
          value: DENIED
          type: query
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "batch_id": "9b8156d7-972d-418d-ac1d-0fda6e2918f7",
            "items": [
              {
                "item_id": "01a0cf75-997b-73fb-b8fc-cfa964b754ed",
                "name": "Bruno",
                "cpf_masked": "123.***.***-09",
                "status": "DENIED",
                "reasons": [
                  "score_below_600"
                ],
                "revolving_amount_cents": 0,
                "attempts": 1
              },
              {
                "item_id": "01a0cf75-997b-73fc-91ec-71f6f128fa1b",
                "name": "Carla",
                "cpf_masked": "987.***.***-00",
                "status": "DENIED",
                "reasons": [
                  "invoice_exceeds_credit_limit"
                ],
                "revolving_amount_cents": 0,
