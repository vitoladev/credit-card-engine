info:
  name: Submit a batch
  type: http
  seq: 1
http:
  method: POST
  url: '{{baseUrl}}/evaluations/batch'
  auth: inherit
  body:
    type: json
    data: |-
      [
        {
          "name": "Ana",
          "cpf": "390.533.447-05",
          "credit_score": 780,
          "current_invoice_cents": 50000,
          "credit_limit_cents": 500000,
          "late_payments": 0,
          "monthly_spend_cents": [
            80000,
            90000,
            70000
          ]
        },
        {
          "name": "Bruno",
          "cpf": "123.456.789-09",
          "credit_score": 520,
          "current_invoice_cents": 200000,
          "credit_limit_cents": 400000,
          "late_payments": 0,
          "monthly_spend_cents": [
            80000
          ]
        },
        {
          "name": "Carla",
          "cpf": "987.654.321-00",
          "credit_score": 690,
          "current_invoice_cents": 900000,
          "credit_limit_cents": 500000,
          "late_payments": 1,
          "monthly_spend_cents": [
            100000,
            120000,
            110000
          ]
        },
        {
          "name": "Diego",
          "cpf": "111.222.333-96",
          "credit_score": 810,
          "current_invoice_cents": 50000,
          "credit_limit_cents": 1200000,
          "late_payments": 3,
          "monthly_spend_cents": [
            200000,
            180000,
            190000
          ]
        }
      ]
runtime:
  assertions:
  - expression: res.status
    operator: eq
    value: '202'
  scripts:
  - type: tests
    code: |-
      test("Submit a batch", function () {
        expect(res.body.queued).to.equal(4);
      });
  - type: after-response
    code: |-
      bru.setVar("batchId", res.body.batch_id);
      bru.setVar("itemId", res.body.item_ids[0]);
docs: Ana is approved; Bruno, Carla, and Diego are denied. item_ids follow the order of the customers.
