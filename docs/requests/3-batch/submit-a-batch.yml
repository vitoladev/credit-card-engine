runtime:
  assertions:
  - expression: res.status
    operator: eq
    value: '202'
  scripts:
  - type: tests
    code: |-
      test("Submit a batch", function () {
        expect(res.body.queued).to.equal(4);
      });
  - type: after-response
    code: |-
      bru.setVar("batchId", res.body.batch_id);
      bru.setVar("itemId", res.body.item_ids[0]);
examples:
  - name: "202"
    description: Captured from a Floci run. IDs change each run.
    request:
      method: POST
      url: "{{baseUrl}}/evaluations/batch"
      headers:
      - name: "content-type"
        value: "application/json"
      body:
        type: json
        data: |-
          [
            {
              "name": "Ana",
              "cpf": "390.533.447-05",
              "credit_score": 780,
              "current_invoice_cents": 50000,
              "credit_limit_cents": 500000,
              "late_payments": 0,
              "monthly_spend_cents": [
                80000,
