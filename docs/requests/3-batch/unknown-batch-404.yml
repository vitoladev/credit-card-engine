info:
  name: 'Unknown batch: 404'
  type: http
  seq: 10
http:
  method: GET
  url: '{{baseUrl}}/batches/00000000-0000-0000-0000-000000000000/items'
  auth: inherit
runtime:
  assertions:
  - expression: res.status
    operator: eq
    value: '404'
examples:
  - name: "404"
    description: Captured from a Floci run. IDs change each run.
    request:
      method: GET
      url: "{{baseUrl}}/batches/00000000-0000-0000-0000-000000000000/items"
    response:
      status: 404
      statusText: "Not Found"
      body:
        type: json
        data: |-
          {
            "error": "not_found"
          }
