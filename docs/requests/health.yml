info:
  name: Health
  type: http
  seq: 1
http:
  method: GET
  url: '{{baseUrl}}/health'
  auth: inherit
runtime:
  assertions:
  - expression: res.status
    operator: eq
    value: '200'
  scripts:
  - type: tests
    code: |-
      test("Health", function () {
        expect(res.body.status).to.equal("ok");
      });
examples:
  - name: "200"
    description: Captured from a Floci run. IDs change each run.
    request:
      method: GET
      url: "{{baseUrl}}/health"
    response:
      status: 200
      statusText: "OK"
      body:
        type: json
        data: |-
          {
            "status": "ok"
          }
docs: The only route without IAM auth.
